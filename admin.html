<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OmniScholar Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-sky-50 text-slate-900 min-h-screen p-5"><main class="max-w-6xl mx-auto space-y-5"><header class="flex justify-between items-center"><div><h1 class="text-2xl font-bold">OmniScholar Admin</h1><p class="text-sm text-slate-500">Restricted usage and account overview</p></div><button id="logout" class="px-4 py-2 bg-white border rounded-lg text-sm">Sign out</button></header><div id="message" class="text-sm"></div><section class="grid md:grid-cols-3 gap-3"><div class="bg-white rounded-xl p-4 border"><div class="text-xs text-slate-500">Registered users</div><div id="users" class="text-2xl font-bold">—</div></div><div class="bg-white rounded-xl p-4 border"><div class="text-xs text-slate-500">Activities logged</div><div id="events" class="text-2xl font-bold">—</div></div><div class="bg-white rounded-xl p-4 border"><div class="text-xs text-slate-500">Searches logged</div><div id="searches" class="text-2xl font-bold">—</div></div></section><section class="bg-white border rounded-xl p-4"><h2 class="font-semibold mb-3">Recent activity</h2><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left border-b"><th class="p-2">When</th><th class="p-2">User</th><th class="p-2">Activity</th><th class="p-2">Details</th></tr></thead><tbody id="activity"></tbody></table></div></section><section class="bg-white border rounded-xl p-4"><h2 class="font-semibold mb-3">Registered accounts</h2><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left border-b"><th class="p-2">Name</th><th class="p-2">Email</th><th class="p-2">Registered</th><th class="p-2">Admin</th></tr></thead><tbody id="account-list"></tbody></table></div></section></main><script>
const SUPABASE_URL='YOUR_SUPABASE_PROJECT_URL'; const SUPABASE_ANON_KEY='YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY';
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); const msg=document.getElementById('message');
async function init(){const {data:{session}}=await client.auth.getSession();if(!session){location.href='./index.html';return;}const {data:profile,error:pe}=await client.from('profiles').select('is_admin').eq('id',session.user.id).single();if(pe||!profile?.is_admin){msg.textContent='Access denied. This account is not an administrator.';return;}const [{data:profiles,error:e1},{data:logs,error:e2}]=await Promise.all([client.from('profiles').select('id,email,full_name,created_at,is_admin').order('created_at',{ascending:false}),client.from('activity_logs').select('user_id,activity,metadata,created_at').order('created_at',{ascending:false}).limit(200)]);if(e1||e2){msg.textContent='Could not load admin data. Check the SQL policies.';return;}document.getElementById('users').textContent=profiles.length;document.getElementById('events').textContent=logs.length;document.getElementById('searches').textContent=logs.filter(x=>x.activity==='search').length;const names=new Map(profiles.map(p=>[p.id,p.email||p.id]));document.getElementById('activity').innerHTML=logs.map(x=>`<tr class="border-b"><td class="p-2 whitespace-nowrap">${new Date(x.created_at).toLocaleString()}</td><td class="p-2">${esc(names.get(x.user_id)||x.user_id)}</td><td class="p-2">${esc(x.activity)}</td><td class="p-2">${esc(JSON.stringify(x.metadata||{}))}</td></tr>`).join('');document.getElementById('account-list').innerHTML=profiles.map(p=>`<tr class="border-b"><td class="p-2">${esc(p.full_name||'')}</td><td class="p-2">${esc(p.email||'')}</td><td class="p-2">${new Date(p.created_at).toLocaleDateString()}</td><td class="p-2">${p.is_admin?'Yes':'No'}</td></tr>`).join('');}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}document.getElementById('logout').onclick=async()=>{await client.auth.signOut();location.href='./index.html';};init();</script></body></html>
